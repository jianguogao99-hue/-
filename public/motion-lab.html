<script>
const $=s=>document.querySelector(s);
const reduced=matchMedia('(prefers-reduced-motion: reduce)');
let spring;
$('#spring').onclick=()=>{
 spring?.stop();
 if(reduced.matches)return;
 const chip=$('#chip');
 chip.style.transform='scale(.84)';
 spring=Motion.animate(chip,{transform:'scale(1)'},{type:'spring',stiffness:420,damping:15});
};
const sheet=$('#sheet');let opened=false;
$('#open').onclick=()=>{
 if(opened)return;
 opened=true;
 sheet.classList.remove('hidden');
 gsap.fromTo(sheet,{yPercent:105},{yPercent:0,duration:reduced.matches?0:.48,ease:'back.out(1.15)',overwrite:true});
};
$('#close').onclick=()=>{
 opened=false;
 gsap.to(sheet,{yPercent:105,duration:reduced.matches?0:.28,ease:'power2.in',overwrite:true,onComplete:()=>sheet.classList.add('hidden')});
};
$('#stagger').onclick=()=>{
 if(reduced.matches)return;
 anime.animate('.item',{opacity:[0,1],x:[-14,0],duration:300,delay:anime.stagger(65),ease:'outCubic'});
};
</script></html>
