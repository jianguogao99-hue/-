<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录问迹</title><link rel="icon" href="/tall-nut.png"><style>*{box-sizing:border-box}body{margin:0;background:#101510;color:#e5eddf;font:15px/1.8 system-ui,sans-serif;min-height:100svh;display:grid;place-items:center;padding:26px}main{max-width:370px;width:100%}img{width:32px;height:44px;object-fit:contain}h1{margin:8px 0;font-size:30px}p,small{color:#a0ae95}label{display:block;margin-top:12px}input,button{font:inherit;width:100%;border-radius:10px;padding:12px;border:1px solid #3f4d35;background:#20291b;color:#e3efda}input{font-size:16px}button{cursor:pointer;margin-top:12px}button[type=submit]{background:#b7d69e;color:#17210f;font-weight:600}button:disabled{opacity:.5}#forgotPassword{border:0;padding:7px;background:none;font-size:13px}small{display:block;font-size:11px;line-height:1.9;margin:18px 0}#authStatus{font-size:13px;overflow-wrap:anywhere}[hidden]{display:none!important}</style><main><img src="/tall-nut.png" alt=""><h1 id="authHeading">登录问迹</h1><p>留下好奇，慢慢找到问题的来路。</p><p class="account-note">登录页不会自动跳转。可在这里登录、注册或重设密码。</p><form id="authForm"><label for="authEmail">账号邮箱</label><input id="authEmail" type="email" autocomplete="email" required><label for="authPassword">密码</label><input id="authPassword" type="password" minlength="8" autocomplete="current-password" required><div id="confirmPasswordField" hidden><label for="authConfirm">确认密码</label><input id="authConfirm" type="password" minlength="8" autocomplete="new-password"></div><button id="submitLogin" type="submit">登录</button><button id="signup" type="button">没有账号？注册</button></form><button id="forgotPassword" type="button">忘记密码</button><p id="authStatus" role="status"></p><small>每个账号的聊天记录、问题地图和 API 配置独立保存。登录后，在设置中填写你自己的 API 密钥。使用邮箱和密码登录，无需授权其他应用。</small></main><script src="/auth-entry.js" defer></script></html>
